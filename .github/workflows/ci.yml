name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:  # the SQL catalog; tests expect it on 5433, like the local test cluster
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: install
        run: pip install "pyiceberg[sql-postgres,pyarrow,duckdb,pyiceberg-core]==0.12.0" duckdb==2.0.0 pyarrow==26.0.1 pytest==9.2.0
      - name: catalog databases
        run: |
          psql -h 127.0.0.1 -p 5433 -U postgres -c "CREATE DATABASE lakehouse"
          psql -h 127.0.0.1 -p 5433 -U postgres -c "CREATE DATABASE lakehouse_test"
      - name: tests (crashes, racing writers, evolution, maintenance, write-audit-publish, analytics)
        run: python -m pytest -q
      - name: the step 1 measurement, end to end (92 days, DuckDB checks every snapshot)
        run: python scripts/load_all.py
